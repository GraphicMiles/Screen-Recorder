name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      # Split per ABI so each installable APK stays well under 30 MB
      # (arm64-v8a is the one modern devices install).
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --tree-shake-icons

      - name: Report APK sizes
        run: ls -l build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optic-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
